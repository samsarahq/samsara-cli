name: Feature request
description: Suggest an improvement to the samsara CLI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The goal, not the solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround today?
